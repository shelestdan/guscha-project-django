services:
  nginx:
    image: nginx:alpine
    container_name: guscha-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./static_root:/var/www/react
      - ./static_root:/var/www/static
      - ./media:/var/www/media
    depends_on:
      - django
    restart: unless-stopped

  django:
    image: python:3.11-slim
    container_name: guscha-django
    command: bash -c "pip install -r requirements.txt && python start_django_server.py"
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: guscha-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes



  telegram-bot:
    image: python:3.11-slim
    container_name: guscha-telegram-bot
    command: bash -c "pip install -r requirements.txt && python manage.py run_telegram_bot"
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    depends_on:
      - django
      - redis
    restart: unless-stopped

volumes:
  redis_data: