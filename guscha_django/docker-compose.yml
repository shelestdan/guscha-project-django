services:
  nginx:
    image: nginx:alpine
    container_name: guscha-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./static_root:/var/www/react
      - ./static_root:/var/www/static
      - ./media:/var/www/media
    depends_on:
      - django
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guscha-django
    volumes:
      - ./logs:/app/logs
      - ./static_root:/app/static_root
      - ./media:/app/media
      - ./db.sqlite3:/app/db.sqlite3
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: guscha-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes



  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: guscha-telegram-bot
    volumes:
      - ./logs:/app/logs
      - ./telegram_bot/logs:/app/telegram_bot/logs
      - ./db.sqlite3:/app/db.sqlite3
    env_file:
      - .env
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 60s
      timeout: 30s
      retries: 3

volumes:
  redis_data: