# Оптимизированный Docker Compose для разработки
version: '3.8'

# Определение сетей для изоляции сервисов
networks:
  guscha-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: guscha-nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static_root:/var/www/react:ro
      - ./static_root:/var/www/static:ro
      - ./media:/var/www/media:ro
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - guscha-network
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    # Healthcheck
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Настройки логирования
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  django:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: guscha-django-dev
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./static_root:/app/static_root
      - ./media:/app/media
    ports:
      - "8000:8000"  # Expose for direct access in dev
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=guscha_project.settings
      - POSTGRES_DB=guscha_dev
      - POSTGRES_USER=guscha
      - POSTGRES_PASSWORD=guscha123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - guscha-network
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    # Healthcheck
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Настройки логирования
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    command: python manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:15.4-alpine
    container_name: guscha-db-dev
    environment:
      POSTGRES_DB: guscha_dev
      POSTGRES_USER: guscha
      POSTGRES_PASSWORD: guscha123
      # Добавляем оптимизации:
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - guscha-network
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    # Healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guscha -d guscha_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Настройки логирования
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: guscha-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://guscha:guscha123@db:5432/guscha_dev?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - guscha-network
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    # Healthcheck
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Настройки логирования
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  redis:
    image: redis:7.2-alpine
    container_name: guscha-redis-dev
    ports:
      - "6379:6379"  # Expose for direct access in dev
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped
    networks:
      - guscha-network
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    # Healthcheck
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Настройки логирования
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram
      target: production
    container_name: guscha-telegram-bot-dev
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./telegram_bot/logs:/app/telegram_bot/logs
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=guscha_project.settings_telegram
      - POSTGRES_DB=guscha_dev
      - POSTGRES_USER=guscha
      - POSTGRES_PASSWORD=guscha123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - guscha-network
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    # Healthcheck
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.append('/app'); from telegram_bot.utils.health import check_bot_health; check_bot_health()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Настройки логирования
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# Именованные volumes с оптимизированными настройками
volumes:
  redis_data_dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  postgres_data_dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres