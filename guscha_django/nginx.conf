events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset utf-8;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstream для Django
    upstream django {
        server django:8000;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 100M;
        
        # Корневая директория для React приложения
        root /var/www/react;

        # React приложение маршруты (должны быть перед статическими файлами)
        location ~ ^/(account|cart|products|orders|login|register|profile)(/.*)?$ {
            try_files /index.html =404;
            expires 1h;
            add_header Cache-Control "public";
        }

        
        # Статические файлы Django админки (наивысший приоритет)
        location /static/admin/ {
            alias /var/www/static/admin/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        
        # Статические файлы unfold (Django админка)
        location /static/unfold/ {
            alias /var/www/static/unfold/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        
        # Статические файлы изображений Django (логотипы и т.д.)
        location /static/images/ {
            alias /var/www/static/images/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        
        # Специальная обработка для axiosConfig.js
        location /static/js/axiosConfig.js {
            alias /var/www/react/js/axiosConfig.js;
            expires 1h;
            add_header Cache-Control "public";
        }
        
        # Статические файлы React приложения (общий блок)
        location /static/ {
            alias /var/www/react/;
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Медиа файлы Django
        location /media/ {
            alias /var/www/media/;
            expires 30d;
            add_header Cache-Control "public";
        }
        
        # API запросы к Django
        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Admin и другие Django маршруты
        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        
        # QR-код триггер маршрут
        location /qr-trigger/ {
            proxy_pass http://django/qr-trigger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Healthcheck
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # React приложение - обслуживание index.html для всех остальных маршрутов
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }
}