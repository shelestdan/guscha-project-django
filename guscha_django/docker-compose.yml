services:
  nginx:
    image: nginx:alpine
    container_name: guscha-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./static_root:/var/www/react
      - ./static_root:/var/www/static
      - ./media:/var/www/media
    depends_on:
      - django
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guscha-django
    volumes:
      - ./logs:/app/logs
      - ./static_root:/app/static_root
      - ./media:/app/media
    env_file:
      - .env
    environment:
      - POSTGRES_DB=guscha_prod
      - POSTGRES_USER=guscha
      - POSTGRES_PASSWORD=guscha123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    expose:
      - "8000"
    depends_on:
      - redis
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: guscha-db-prod
    environment:
      POSTGRES_DB: guscha_prod
      POSTGRES_USER: guscha
      POSTGRES_PASSWORD: guscha123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    expose:
      - "5432"
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guscha -d guscha_prod"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: guscha-postgres-exporter-prod
    environment:
      DATA_SOURCE_NAME: "postgresql://guscha:guscha123@db:5432/guscha_prod?sslmode=disable"
    expose:
      - "9187"
    depends_on:
      - db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: guscha-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes



  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: guscha-telegram-bot
    volumes:
      - ./logs:/app/logs
      - ./telegram_bot/logs:/app/telegram_bot/logs
    env_file:
      - .env
    environment:
      - POSTGRES_DB=guscha_prod
      - POSTGRES_USER=guscha
      - POSTGRES_PASSWORD=guscha123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 60s
      timeout: 30s
      retries: 3

volumes:
  redis_data:
  postgres_data_prod: